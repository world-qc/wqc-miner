name: Release

on:
  push:
    tags:
      # Policy: SemVer vMAJOR.MINOR.PATCH (see README). Glob is approximate;
      # `check-tag` rejects non-SemVer tags before builds run.
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (SemVer, e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: 0

jobs:
  check-tag:
    name: Validate SemVer tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout wqc-miner
        uses: actions/checkout@v4
        with:
          # Tag push: the tagged commit. workflow_dispatch: the run's SHA.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Resolve and validate tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Bundle version: SemVer with leading v (no pre-release suffix yet).
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag '$TAG'. Use vMAJOR.MINOR.PATCH (e.g. v0.1.0)." >&2
            exit 1
          fi
          EXPECTED="${TAG#v}"
          CARGO_VER="$(awk '
            /^\[package\]/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          if [[ -z "$CARGO_VER" ]]; then
            echo "Could not read version from Cargo.toml [package]" >&2
            exit 1
          fi
          if [[ "$CARGO_VER" != "$EXPECTED" ]]; then
            echo "Tag '$TAG' does not match Cargo.toml version '$CARGO_VER' (expected v$CARGO_VER)." >&2
            exit 1
          fi
          echo "OK: tag $TAG matches Cargo.toml version $CARGO_VER"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

  build-windows:
    name: ${{ matrix.artifact_name }}
    needs: [check-tag]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact_name: wqc-miner-windows-x64
            runner: windows-latest
          # ring 0.16 (libp2p QUIC/rcgen) cannot cross-compile x64→Win ARM64.
          - target: aarch64-pc-windows-msvc
            artifact_name: wqc-miner-windows-arm64
            runner: windows-11-arm

    steps:
      - name: Checkout wqc-miner
        uses: actions/checkout@v4
        with:
          path: wqc-miner

      # App token for sibling checkouts (works if a listed repo is private or public).
      # Grant the App Contents: Read on each repo in `repositories:` below.
      - name: Generate token for private deps
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WQC_APP_ID }}
          private-key: ${{ secrets.WQC_APP_PRIVATE_KEY }}
          owner: world-qc
          repositories: wqc-core,wqc-node,wqc-stark-engine

      - name: Checkout wqc-core
        uses: actions/checkout@v4
        with:
          repository: world-qc/wqc-core
          path: wqc-core
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout wqc-node
        uses: actions/checkout@v4
        with:
          repository: world-qc/wqc-node
          path: wqc-node
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout wqc-stark-engine
        uses: actions/checkout@v4
        with:
          repository: world-qc/wqc-stark-engine
          path: wqc-stark-engine
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            wqc-miner
            wqc-core
            wqc-node

      - name: Build wqc-core (webgpu)
        working-directory: wqc-core
        run: cargo build --release --locked --features webgpu --target ${{ matrix.target }}

      - name: Build wqc-node
        working-directory: wqc-node
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build wqc-miner
        working-directory: wqc-miner
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage bundle
        shell: pwsh
        run: |
          $staging = "dist/${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path "$staging/bin" | Out-Null
          $targetDir = "$env:CARGO_TARGET_DIR/${{ matrix.target }}/release"
          Copy-Item "$targetDir/wqc-miner.exe" "$staging/"
          Copy-Item "$targetDir/wqc-core.exe" "$staging/bin/"
          Copy-Item "$targetDir/wqc-node.exe" "$staging/bin/"
          Copy-Item wqc-miner/LICENSE, wqc-miner/settings.toml.example, wqc-miner/README.md "$staging/"

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ matrix.artifact_name }}" -DestinationPath "dist/${{ matrix.artifact_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  build-mac-universal:
    name: wqc-miner-mac-universal
    needs: [check-tag]
    runs-on: macos-14
    steps:
      - name: Checkout wqc-miner
        uses: actions/checkout@v4
        with:
          path: wqc-miner

      # App token for sibling checkouts (works if a listed repo is private or public).
      # Grant the App Contents: Read on each repo in `repositories:` below.
      - name: Generate token for private deps
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WQC_APP_ID }}
          private-key: ${{ secrets.WQC_APP_PRIVATE_KEY }}
          owner: world-qc
          repositories: wqc-core,wqc-node,wqc-stark-engine

      - name: Checkout wqc-core
        uses: actions/checkout@v4
        with:
          repository: world-qc/wqc-core
          path: wqc-core
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout wqc-node
        uses: actions/checkout@v4
        with:
          repository: world-qc/wqc-node
          path: wqc-node
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout wqc-stark-engine
        uses: actions/checkout@v4
        with:
          repository: world-qc/wqc-stark-engine
          path: wqc-stark-engine
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            wqc-miner
            wqc-core
            wqc-node

      - name: Build crates (aarch64 + x86_64)
        shell: bash
        run: |
          set -euo pipefail
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            (cd wqc-core && cargo build --release --locked --features webgpu --target "$arch")
            (cd wqc-node && cargo build --release --locked --target "$arch")
            (cd wqc-miner && cargo build --release --locked --target "$arch")
          done

      - name: Create universal binaries
        shell: bash
        run: |
          set -euo pipefail
          STAGING="dist/wqc-miner-mac-universal"
          mkdir -p "${STAGING}/bin"
          lipo -create \
            "${CARGO_TARGET_DIR}/aarch64-apple-darwin/release/wqc-miner" \
            "${CARGO_TARGET_DIR}/x86_64-apple-darwin/release/wqc-miner" \
            -output "${STAGING}/wqc-miner"
          lipo -create \
            "${CARGO_TARGET_DIR}/aarch64-apple-darwin/release/wqc-core" \
            "${CARGO_TARGET_DIR}/x86_64-apple-darwin/release/wqc-core" \
            -output "${STAGING}/bin/wqc-core"
          lipo -create \
            "${CARGO_TARGET_DIR}/aarch64-apple-darwin/release/wqc-node" \
            "${CARGO_TARGET_DIR}/x86_64-apple-darwin/release/wqc-node" \
            -output "${STAGING}/bin/wqc-node"
          chmod +x "${STAGING}/wqc-miner" "${STAGING}/bin/wqc-core" "${STAGING}/bin/wqc-node"
          cp wqc-miner/LICENSE wqc-miner/settings.toml.example wqc-miner/README.md "${STAGING}/"
          file "${STAGING}/wqc-miner"
          file "${STAGING}/bin/wqc-core"
          file "${STAGING}/bin/wqc-node"

      - name: Package dmg
        run: |
          hdiutil create \
            -volname "WQC Miner" \
            -srcfolder "dist/wqc-miner-mac-universal" \
            -ov -format UDZO \
            "dist/wqc-miner-mac-universal.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wqc-miner-mac-universal
          path: dist/wqc-miner-mac-universal.dmg
          if-no-files-found: error

  build-linux:
    name: ${{ matrix.artifact_name }}
    needs: [check-tag]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_name: wqc-miner-linux-x64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            artifact_name: wqc-miner-linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout wqc-miner
        uses: actions/checkout@v4
        with:
          path: wqc-miner

      # App token for sibling checkouts (works if a listed repo is private or public).
      # Grant the App Contents: Read on each repo in `repositories:` below.
      - name: Generate token for private deps
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WQC_APP_ID }}
          private-key: ${{ secrets.WQC_APP_PRIVATE_KEY }}
          owner: world-qc
          repositories: wqc-core,wqc-node,wqc-stark-engine

      - name: Checkout wqc-core
        uses: actions/checkout@v4
        with:
          repository: world-qc/wqc-core
          path: wqc-core
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout wqc-node
        uses: actions/checkout@v4
        with:
          repository: world-qc/wqc-node
          path: wqc-node
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout wqc-stark-engine
        uses: actions/checkout@v4
        with:
          repository: world-qc/wqc-stark-engine
          path: wqc-stark-engine
          token: ${{ steps.app-token.outputs.token }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            wqc-miner
            wqc-core
            wqc-node

      - name: Build wqc-core (webgpu)
        working-directory: wqc-core
        run: cargo build --release --locked --features webgpu --target ${{ matrix.target }}

      - name: Build wqc-node
        working-directory: wqc-node
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build wqc-miner
        working-directory: wqc-miner
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage and package
        shell: bash
        run: |
          set -euo pipefail
          STAGING="dist/${{ matrix.artifact_name }}"
          mkdir -p "${STAGING}/bin"
          TARGET_DIR="${CARGO_TARGET_DIR}/${{ matrix.target }}/release"
          cp "${TARGET_DIR}/wqc-miner" "${STAGING}/"
          cp "${TARGET_DIR}/wqc-core" "${STAGING}/bin/"
          cp "${TARGET_DIR}/wqc-node" "${STAGING}/bin/"
          chmod +x "${STAGING}/wqc-miner" "${STAGING}/bin/wqc-core" "${STAGING}/bin/wqc-node"
          cp wqc-miner/LICENSE wqc-miner/settings.toml.example wqc-miner/README.md "${STAGING}/"
          tar -czf "dist/${{ matrix.artifact_name }}.tar.gz" -C dist "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [check-tag, build-windows, build-mac-universal, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release asset paths
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            dist/wqc-miner-windows-x64/wqc-miner-windows-x64.zip
            dist/wqc-miner-windows-arm64/wqc-miner-windows-arm64.zip
            dist/wqc-miner-mac-universal/wqc-miner-mac-universal.dmg
            dist/wqc-miner-linux-x64/wqc-miner-linux-x64.tar.gz
            dist/wqc-miner-linux-arm64/wqc-miner-linux-arm64.tar.gz
          )
          for p in "${paths[@]}"; do
            test -f "$p"
          done
          {
            echo "subject_path<<EOF"
            printf '%s\n' "${paths[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # SLSA build provenance via Sigstore (public-good). No CA code-signing certs.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.assets.outputs.subject_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-tag.outputs.tag }}
          name: ${{ needs.check-tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Verify provenance

            WQC does **not** use commercial CA code-signing certificates (Sectigo, GlobalSign, Apple Developer ID, etc.).
            Release assets are bound to this workflow run with [GitHub Artifact Attestations](https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds) (Sigstore).

            ```bash
            gh attestation verify wqc-miner-linux-x64.tar.gz -R world-qc/wqc-miner
            ```

            Replace the filename with the asset you downloaded. OS SmartScreen / Gatekeeper prompts may still appear; treat `gh attestation verify` as the trust path.
          files: |
            dist/wqc-miner-windows-x64/wqc-miner-windows-x64.zip
            dist/wqc-miner-windows-arm64/wqc-miner-windows-arm64.zip
            dist/wqc-miner-mac-universal/wqc-miner-mac-universal.dmg
            dist/wqc-miner-linux-x64/wqc-miner-linux-x64.tar.gz
            dist/wqc-miner-linux-arm64/wqc-miner-linux-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
